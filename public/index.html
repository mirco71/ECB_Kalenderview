<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalender Wochenansicht</title>
  <link rel="stylesheet" href="/css/calendar.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 id="kalenderName">📅 Kalender</h1>
      <div class="nav-controls">
        <div class="view-switch">
          <button class="nav-btn view-btn active" id="btnWoche" onclick="setzeAnsicht('woche')">Woche</button>
          <button class="nav-btn view-btn" id="btnMonat" onclick="setzeAnsicht('monat')">Monat</button>
        </div>
        <button class="nav-btn" id="btnMonatZurueck" onclick="vorherigerMonat()" title="Einen Monat zurück">«</button>
        <button class="nav-btn" onclick="zurueck()">← Vorherige</button>
        <span class="week-info" id="weekInfo">KW --</span>
        <button class="nav-btn" onclick="vor()">Nächste →</button>
        <button class="nav-btn" id="btnMonatVor" onclick="naechsterMonat()" title="Einen Monat vor">»</button>
        <button class="nav-btn" onclick="heuteAnzeigen()">Heute</button>
        <input type="date" class="nav-date" id="datumSprung" onchange="springeZuDatum(this.value)" title="Zu Datum springen">
      </div>
    </div>
    
    <div id="kalenderContent">
      <div class="loading">⏳ Lade Kalender...</div>
    </div>
    
    <div class="legend" id="legend"></div>
  </div>

  <a href="/login.html" class="admin-link">🔒 Admin</a>

  <script src="/js/api.js"></script>
  <script src="/js/calendar.js"></script>
</body>
</html>
