# Standard-Variante mit veröffentlichtem Port. Hinter einem Cloudflare Tunnel
# stattdessen docker-compose.tunnel.yml verwenden. Die Service-Definition beider
# Dateien synchron halten.

services:
  ecb-kalender:
    build:
      context: .
    image: ecb-kalender:latest
    container_name: ecb-kalender
    restart: unless-stopped
    ports:
      - "3050:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /app/data/calendar.db
      # Pflicht für Serientermine — siehe Kommentar im Dockerfile
      TZ: ${TZ:-Europe/Berlin}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET muss als Stack-Umgebungsvariable in Portainer gesetzt werden}
      CALENDAR_NAME: ${CALENDAR_NAME:-Eisbelegung Eissporthalle Solingen}
      START_HOUR: ${START_HOUR:-6}
      END_HOUR: ${END_HOUR:-23}
      # HTTPS-Pflicht für Login-Cookie und upgrade-insecure-requests. Leer =
      # an (NODE_ENV=production). Nur für Zugriff per http://<NAS-IP>:3050 auf false.
      SECURE_TRANSPORT: ${SECURE_TRANSPORT:-}
      # Kontakt für /.well-known/security.txt, z. B. mailto:... Leer = 404.
      SECURITY_CONTACT: ${SECURITY_CONTACT:-}
    volumes:
      - ecb-data:/app/data
      # Alternative: Bind-Mount auf einen Synology-Freigabeordner statt
      # eines benannten Volumes (einfacher für Hyper Backup):
      # - /volume1/docker/ecb-kalender/data:/app/data

volumes:
  ecb-data:
